[env:esp32-evb]
platform = espressif32
board = esp32-evb
; change microcontroller
; board_build.mcu = esp32
; change MCU frequency
; board_build.f_cpu = 240000000L
framework = arduino
monitor_speed = 115200
; monitor_rts = 0
; monitor_dtr = 0
upload_speed = 115200

build_flags = -DCORE_DEBUG_LEVEL=3
build_src_filter = +<*> -<apps/>

lib_deps =
    dlloydev/QuickPID @ ^3.1.9
    cytrontechnologies/Cytron Motor Drivers Library@^1.0.1
    madhephaestus/ESP32Encoder@^0.12.0

; Encoder calibration app - see src/apps/calib_encoder_app.cpp for
; usage instructions. Build/flash with: pio run -e calib_encoder -t upload
[env:calib_encoder]
extends = env:esp32-evb
build_src_filter = +<*> -<apps/> -<main.cpp> +<apps/calib_encoder_app.cpp>